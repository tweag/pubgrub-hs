name: CI

# build compiles the project once per target and GHC, runs its test suites,
# and uploads the executables as an archive; test unpacks that archive on a
# separate runner, without a build tree, and runs the executables; sdist
# makes the source distributions of the two published packages; hackage
# builds and tests them from those tarballs alone, on the GHCs they claim;
# docs makes the Haddock documentation for Hackage and for GitHub Pages; dist
# uploads the tested archives, the source distributions and the documentation
# tarballs with SHA256SUMS as one artifact; format checks that every Haskell
# file is as stylish-haskell writes it; commits checks the commit messages of
# a PR; ci-ok is the one check that the ruleset requires; release publishes
# dist when the head of main is a release commit, made by
# `mise run release-pr`; pages then publishes the documentation to GitHub
# Pages. Nothing is rebuilt after testing.
#
# A manual run (Actions > CI > Run workflow, or `gh workflow run ci.yml
# --ref BRANCH`) makes every artifact of a release, in dist, without
# releasing: release runs only on a push to main.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CABAL_VERSION: 3.18.1.0
  # Release archives and documentation come from the builds with this GHC.
  # It must be one of matrix.ghc, normally the newest.
  RELEASE_GHC: 9.14.1
  # The executables that a release publishes, by name, separated by spaces.
  # Each has an archive of its own, NAME-VERSION-TARGET.tar.gz (.zip on
  # Windows), with the version of its package. Other executables in the
  # project are built and tested but not published.
  EXECUTABLES: pubgrub

jobs:
  build:
    name: Build ${{ matrix.target }}, GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.build-runner }}

    strategy: &strategy
      fail-fast: false
      matrix:
        ghc:
          - 9.12.2
          - 9.14.1
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
        include:
          # Linux builds run on the oldest runner, as the binaries need a
          # glibc at least as new as the one they were built with.
          - target: x86_64-linux
            build-runner: ubuntu-22.04
            test-runner: ubuntu-latest
          - target: aarch64-linux
            build-runner: ubuntu-22.04-arm
            test-runner: ubuntu-24.04-arm
          - target: x86_64-macos
            build-runner: macos-15-intel
            test-runner: macos-15-intel
          - target: aarch64-macos
            build-runner: macos-15
            test-runner: macos-latest
          - target: x86_64-windows
            build-runner: windows-2025
            test-runner: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Plan
        run: cabal build all --enable-tests --dry-run

      - name: Restore cabal store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-store-${{ matrix.target }}-ghc-${{ matrix.ghc }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-store-${{ matrix.target }}-ghc-${{ matrix.ghc }}-

      - name: Build dependencies
        run: cabal build all --enable-tests --only-dependencies -j

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: |
          cabal build all --enable-tests -j
          mkdir out
          for exe in $EXECUTABLES; do
            cp "$(cabal list-bin "exe:$exe")" out/
          done

      # One "NAME VERSION" line for each of EXECUTABLES. A native jq on Windows
      # ends its lines with CRLF.
      - name: List executables
        run: |
          jq -r --arg exes "$EXECUTABLES" '
            ($exes / " " | map("exe:" + .)) as $wanted
            | .["install-plan"][]
            | select(.style == "local" and (.["component-name"] | IN($wanted[])))
            | "\(.["component-name"] | ltrimstr("exe:")) \(.["pkg-version"])"
          ' dist-newstyle/cache/plan.json | tr -d '\r' > executables.txt
          cat executables.txt

      # --enable-tests keeps the configuration of the build above: without it,
      # cabal test requests the test stanzas differently, reconfigures and
      # rebuilds every package with a test suite, and the doctests, which load
      # every library the GHC environment file names, read one as it is being
      # relinked.
      - name: Test
        run: cabal test all --enable-tests --test-show-details=direct

      - name: Strip
        if: runner.os != 'Windows'
        working-directory: out
        # EXECUTABLES is a list of names, split into words on purpose.
        run: |
          # shellcheck disable=SC2086
          strip $EXECUTABLES

      # strip invalidates the linker's ad-hoc signature.
      - name: Sign
        if: runner.os == 'macOS'
        working-directory: out
        run: |
          # shellcheck disable=SC2086
          codesign --force --sign - $EXECUTABLES

      # The executables must only need libraries that every distribution has,
      # with a stable ABI.
      - name: Check shared libraries
        if: runner.os == 'Linux'
        working-directory: out
        run: |
          for exe in $EXECUTABLES; do
            needed=$(readelf -d "$exe" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
            echo "$exe: $needed"
            if grep -vxE 'libc\.so\.6|libm\.so\.6|libz\.so\.1|libgmp\.so\.10|ld-linux-.*\.so\.[0-9]+' <<< "$needed"; then
              echo "::error::unexpected shared library dependencies of $exe (above)"
              exit 1
            fi
          done

      # Only system libraries; e.g. no Homebrew gmp.
      - name: Check shared libraries
        if: runner.os == 'macOS'
        working-directory: out
        run: |
          for exe in $EXECUTABLES; do
            needed=$(otool -L "$exe" | tail -n +2 | awk '{print $1}')
            echo "$exe: $needed"
            if grep -vE '^(/usr/lib/|/System/Library/)' <<< "$needed"; then
              echo "::error::unexpected shared library dependencies of $exe (above)"
              exit 1
            fi
          done

      - name: Archive
        if: runner.os != 'Windows'
        working-directory: out
        run: |
          mkdir ../archives
          while read -r exe version; do
            tar -czf "../archives/$exe-$version-${{ matrix.target }}.tar.gz" "$exe"
          done < ../executables.txt

      - name: Archive
        if: runner.os == 'Windows'
        working-directory: out
        run: |
          mkdir ../archives
          while read -r exe version; do
            7z a "../archives/$exe-$version-${{ matrix.target }}.zip" "./$exe.exe"
          done < ../executables.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-ghc-${{ matrix.ghc }}
          path: archives/*
          if-no-files-found: error

  test:
    name: Test ${{ matrix.target }}, GHC ${{ matrix.ghc }}
    needs: build
    runs-on: ${{ matrix.test-runner }}
    strategy: *strategy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}-ghc-${{ matrix.ghc }}
          path: artifact

      - name: Unpack
        if: runner.os != 'Windows'
        run: |
          mkdir bin
          for archive in artifact/*.tar.gz; do
            tar -xzf "$archive" -C bin
          done

      - name: Unpack
        if: runner.os == 'Windows'
        run: |
          for archive in artifact/*.zip; do
            7z x -obin "$archive"
          done

      # Replace with the project's own test of a built executable, such as
      # `sh tests/run.sh bin/EXE`, when it has one.
      - name: Test
        run: |
          for exe in $EXECUTABLES; do
            "bin/$exe" --version
          done

  # The source distributions of the two packages meant for Hackage, as cabal
  # sdist makes them: only the files that the .cabal files list, unlike a
  # checkout of the repository. cabal sdist needs no GHC and its tarballs
  # are reproducible.
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ env.RELEASE_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false

      - name: Make source distributions
        run: cabal sdist pubgrub pubgrub-cabal -o sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: sdist/*.tar.gz
          if-no-files-found: error

  # The two packages meant for Hackage, built and tested from the tarballs of
  # the sdist job alone: no checkout and no cabal.project of the repository,
  # so their own bounds have to solve. Each runs on every GHC its tested-with
  # claims. cabal check is what Hackage runs on upload.
  hackage:
    name: Hackage packages, GHC ${{ matrix.ghc }}
    needs: sdist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghc: 9.10.3
            packages: pubgrub
          - ghc: 9.12.2
            packages: pubgrub pubgrub-cabal
          - ghc: 9.14.1
            packages: pubgrub pubgrub-cabal
    env:
      PACKAGES: ${{ matrix.packages }}
    steps:
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Download source distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: sdist

      # PACKAGES is a list of names, split into words on purpose. The digit
      # keeps pubgrub from matching the tarball of pubgrub-cabal.
      - name: Unpack the source distributions
        run: |
          mkdir unpacked
          for package in $PACKAGES; do
            tar -xzf "sdist/$package"-[0-9]*.tar.gz -C unpacked
          done
          {
            echo "packages:"
            for dir in unpacked/*/; do echo "  $dir"; done
            echo "tests: True"
          } > cabal.project.hackage
          cat cabal.project.hackage

      - name: Plan
        run: cabal build --project-file=cabal.project.hackage all --dry-run

      - name: Restore cabal store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-store-hackage-ghc-${{ matrix.ghc }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-store-hackage-ghc-${{ matrix.ghc }}-

      - name: Build dependencies
        run: cabal build --project-file=cabal.project.hackage all --only-dependencies -j

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build and test
        run: |
          cabal build --project-file=cabal.project.hackage all -j
          cabal test --project-file=cabal.project.hackage all --test-show-details=direct

      - name: cabal check
        run: |
          for dir in unpacked/*/; do
            (cd "$dir" && cabal check)
          done

  # The documentation of the two packages published to Hackage, built with
  # RELEASE_GHC: a tarball for Hackage (`cabal upload --documentation`),
  # which the release publishes, and the documentation of the whole project
  # from cabal haddock-project, which the pages job publishes. Both link to
  # the documentation of the dependencies on Hackage. A package without a
  # library has no documentation.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: ${{ env.RELEASE_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Plan
        run: cabal build all --dry-run

      # The x86_64-linux build with RELEASE_GHC caches the same dependencies.
      - name: Restore cabal store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-store-x86_64-linux-ghc-${{ env.RELEASE_GHC }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-store-x86_64-linux-ghc-${{ env.RELEASE_GHC }}-

      - name: Build dependencies
        run: cabal build all --only-dependencies -j

      # The Haddocks of the two Hackage packages build with no warning and
      # document every export.
      - name: Haddock warnings and coverage
        run: scripts/check-haddock.sh pubgrub pubgrub-cabal

      # pubgrub-hs, pubgrub-cli and pubgrub-harness are not published, so
      # their documentation is not built for Hackage.
      - name: Documentation for Hackage
        run: |
          cabal haddock pubgrub pubgrub-cabal --haddock-for-hackage
          # -p: the repository may track a docs directory of its own.
          mkdir -p docs
          mv dist-newstyle/*-docs.tar.gz docs/

      # cabal.project writes a GHC environment file for the doctests, and it
      # names every local package as an inplace unit, built or not. The index
      # that haddock-project builds last would load it and stop at the first
      # package this job never registered, so GHC is told to ignore the file.
      - name: Documentation of the project
        env:
          GHC_ENVIRONMENT: '-'
        run: cabal haddock-project --hackage --output=site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: docs/*-docs.tar.gz
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Every tracked Haskell file must be as stylish-haskell writes it, with
  # .stylish-haskell.yaml. mise installs what mise.lock records, and the task
  # is the one that formats the tree locally. The action's tool cache stays
  # off, here and in commits: mise does not check a restored tool against
  # mise.lock.
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false

      - name: Check formatting
        run: mise run format --check

  # Every commit of a PR must follow Conventional Commits, with a type that a
  # commit parser in cliff.toml knows: the release task reads them to choose
  # the next version and to write CHANGELOG.md. git-cliff checks the PR's
  # commits with cliff.toml, without the filters that drop unconventional and
  # unmatched commits from the changelog, and fails on either kind.
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false

      - name: Check Conventional Commits
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_CLIFF__GIT__FILTER_UNCONVENTIONAL: "false"
          GIT_CLIFF__GIT__FILTER_COMMITS: "false"
          GIT_CLIFF__GIT__REQUIRE_CONVENTIONAL: "true"
          GIT_CLIFF__GIT__FAIL_ON_UNMATCHED_COMMIT: "true"
        run: git-cliff --verbose "origin/$GITHUB_BASE_REF..$HEAD_SHA"

  # Everything that a release publishes, in one artifact "dist": the archives
  # built with RELEASE_GHC, the source distributions, the documentation
  # tarballs and SHA256SUMS. It runs on every event: a PR, or a manual run
  # (workflow_dispatch, on any branch), gets the same files as a release.
  dist:
    name: dist
    needs: [test, sdist, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-ghc-${{ env.RELEASE_GHC }}'
          path: archives
          merge-multiple: true

      - name: Download source distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: sdist

      - name: Download documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: docs

      - name: Make checksums
        run: |
          mkdir dist
          mv archives/* sdist/*.tar.gz docs/*-docs.tar.gz dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # The one check that the ruleset requires: whatever the matrix becomes, it
  # fails if any job it needs failed or was cancelled. Without always(), a
  # failed job would make it skipped, and GitHub treats a skipped required
  # check as passed. commits is skipped on pushes to main, which is fine.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [build, test, sdist, hackage, docs, dist, commits, format]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Publishes the dist artifact as a release when the head of main is a
  # release commit ("chore(release): VERSION"), and never on a PR or a manual
  # run. VERSION names the tag. It is idempotent: a rerun continues a draft,
  # or does nothing if the release is published.
  release:
    name: release
    needs: ci-ok
    # The implicit success() would also look at commits, which is skipped on
    # pushes, and so skip this job too. Check ci-ok's result instead.
    if: >-
      !cancelled() && needs.ci-ok.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'chore(release): ')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(git log -1 --format=%s)
          version=${subject#"chore(release): "}
          # A squash merge appends " (#123)" to the subject.
          version=${version%% *}
          state=$(gh release view "v$version" --json isDraft \
                    --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
          echo "v$version: $state"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"

      - name: Download dist
        if: steps.plan.outputs.state != 'published'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Release notes
        if: steps.plan.outputs.state != 'published'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Attest build provenance
        if: steps.plan.outputs.state != 'published'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Create the draft release
        if: steps.plan.outputs.state == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file NOTES.md

      - name: Upload and publish
        if: steps.plan.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # The release is a draft here, so --clobber is safe on a rerun.
          gh release upload "$TAG" dist/* --clobber
          # Publishing creates the tag and locks the tag and the assets.
          gh release edit "$TAG" --draft=false --latest

  # Publishes the documentation of the project to GitHub Pages when a release
  # is published, so the site shows the latest release. It deploys the site
  # that the docs job of this run built.
  pages:
    name: pages
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
